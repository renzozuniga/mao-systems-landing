<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14532D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: rounded square (110×110, y=10) — identical to standalone icon -->
  <rect x="0" y="10" width="110" height="110" rx="20" ry="20" fill="url(#bg-gradient)" />

  <!-- MS monogram inside icon — tech font, vertically centered -->
  <text
    x="55"
    y="77"
    font-family="'Trebuchet MS', 'Century Gothic', 'Gill Sans MT', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    text-anchor="middle"
    letter-spacing="3"
    fill="white"
    opacity="0.96"
  >MS</text>

  <!-- "MAO" wordmark — baseline y=78, vertically centered to icon (center y=65) -->
  <text
    x="128"
    y="78"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="50"
    font-weight="800"
    letter-spacing="-1"
    fill="#14532D"
  >MAO</text>

  <!-- "SYSTEMS" subtitle — aligned to same x as MAO -->
  <text
    x="128"
    y="101"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="600"
    letter-spacing="5.5"
    fill="#15803D"
  >SYSTEMS</text>
</svg>
