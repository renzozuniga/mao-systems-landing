# Security fixes arrive as soon as an advisory is published (repo setting);
# these monthly grouped PRs keep routine version drift small.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      client-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      server-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
