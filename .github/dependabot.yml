# Security fixes arrive as soon as an advisory is published (repo setting);
# these monthly grouped PRs keep routine version drift small.
# Major versions are ignored on purpose: they can break things and pairs like
# react/react-dom or vite/@vitejs/plugin-react must move together, so those
# upgrades are done deliberately, one at a time, and tested.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      client-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      server-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
